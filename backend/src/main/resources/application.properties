spring.application.name=yoghurt-ecommerce-backend

# --- Server ---
server.port=8080

# --- Database (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/yoghurt_ecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# app.jwt.secret must be a Base64-encoded key at least 256 bits (32 bytes) long for HS256.
# Generate one with: openssl rand -base64 32
app.jwt.secret=CHANGE_ME_REPLACE_WITH_A_BASE64_SECRET_AT_LEAST_32_BYTES_LONG
app.jwt.expiration-ms=86400000
