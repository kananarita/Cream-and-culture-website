spring.application.name=yoghurt-ecommerce-backend

# ---- Server ----
server.port=8080

# ---- Datasource (MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/yoghurt_ecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# Flyway owns the schema; Hibernate should only validate it, not auto-generate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- JWT ----
# 256-bit+ secret. Override this via an environment variable in real deployments.
app.jwt.secret=${JWT_SECRET:c29tZXZlcnlzZWNyZXRrZXlmb3J5b2dodXJ0c2hvcGJhY2tlbmRhcHAxMjM0NTY=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---- Logging ----
logging.level.com.yoghurtshop.backend=DEBUG
